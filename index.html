<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Math Quest</title>
<meta name="theme-color" content="#5b4bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5b4bdb;
 font-family:ui-rounded,"Nunito","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:#2b2160}
body{background:linear-gradient(160deg,#6c5ce7 0%,#a29bfe 55%,#74b9ff 100%)}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;
 padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.screen{position:absolute;inset:0;padding:inherit;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:28px;box-shadow:0 8px 0 rgba(43,33,96,.18);padding:18px;width:100%}
h1{color:#fff;font-size:clamp(34px,10vw,48px);margin:8px 0 2px;text-shadow:0 4px 0 rgba(43,33,96,.25);text-align:center}
.sub{color:#fff;font-weight:700;opacity:.95;margin:0 0 10px;text-align:center}
.buddy{font-size:clamp(70px,22vw,110px);line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.stats{display:flex;gap:10px;width:100%;margin:6px 0 12px}
.stat{flex:1;background:rgba(255,255,255,.9);border-radius:18px;padding:8px;text-align:center;font-weight:800;font-size:18px}
.stat small{display:block;font-size:12px;opacity:.7}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.btn{border:0;border-radius:22px;font:inherit;font-weight:900;color:#fff;cursor:pointer;
 padding:16px 8px;font-size:20px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn .e{display:block;font-size:34px;margin-bottom:2px}
.btn .lv{display:block;font-size:12px;opacity:.9;font-weight:700}
.add{background:#00b894}.sub_{background:#e17055}.mul{background:#fd79a8}.mix{background:#fdcb6e;color:#2b2160}
.wide{grid-column:span 2}
.row{display:flex;gap:10px;width:100%;margin-top:12px}
.small{flex:1;background:rgba(255,255,255,.92);color:#2b2160;font-size:16px;padding:12px 6px;box-shadow:0 5px 0 rgba(43,33,96,.18)}
/* game */
.top{display:flex;align-items:center;width:100%;gap:10px;margin-bottom:10px}
.x{width:46px;height:46px;border-radius:50%;background:#fff;border:0;font-size:22px;font-weight:900;box-shadow:0 4px 0 rgba(43,33,96,.2)}
.bar{flex:1;height:18px;background:rgba(255,255,255,.4);border-radius:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ffeaa7;border-radius:12px;transition:width .4s}
.pill{background:#fff;border-radius:16px;padding:6px 12px;font-weight:900;font-size:18px}
.q{flex:0 0 auto;text-align:center;padding:22px 10px;margin-top:4px}
.eq{font-size:clamp(46px,15vw,76px);font-weight:900;letter-spacing:2px;color:#2b2160}
.eq b{color:#6c5ce7}
.hint{min-height:28px;margin-top:6px;font-weight:800;font-size:18px;color:#e17055}
.dots{min-height:26px;font-size:18px;letter-spacing:2px;word-break:break-all}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:16px;flex:1;max-height:340px}
.a{background:#fff;border:0;border-radius:26px;font:inherit;font-size:clamp(34px,11vw,54px);font-weight:900;color:#2b2160;
 box-shadow:0 8px 0 rgba(43,33,96,.22);transition:transform .08s,box-shadow .08s,background .15s}
.a:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(43,33,96,.22)}
.a.ok{background:#55efc4;animation:jump .5s}
.a.no{background:#ff7675;color:#fff;animation:shake .4s}
.a.off{opacity:.45;pointer-events:none}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes jump{40%{transform:scale(1.12)}}
.streak{height:30px;color:#fff;font-weight:900;font-size:20px;margin-top:10px;text-shadow:0 2px 0 rgba(43,33,96,.3)}
/* results / stickers */
.big{font-size:clamp(60px,20vw,100px)}
.res{text-align:center}
.res h2{margin:6px 0;font-size:30px}
.stars{font-size:34px;letter-spacing:4px;margin:6px 0}
.new{background:#ffeaa7;border-radius:20px;padding:10px;margin:10px 0;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;overflow:auto;padding:4px 2px 12px;flex:1;align-content:start}
.st{background:#fff;border-radius:18px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,10vw,46px);box-shadow:0 4px 0 rgba(43,33,96,.18)}
.st.lock{background:rgba(255,255,255,.35);color:rgba(255,255,255,.7);font-size:26px;box-shadow:none}
.confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:rgba(43,33,96,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .card{max-width:380px;text-align:center}
.modal h3{margin:0 0 6px;font-size:24px}
.modal .btn{width:100%;margin-top:10px}
.install{display:none}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<section class="screen on" id="home">
  <div class="buddy" id="buddy">🦊</div>
  <h1>Math Quest</h1>
  <p class="sub" id="hello">Pick a quest!</p>
  <div class="stats">
    <div class="stat">⭐ <span id="sStars">0</span><small>stars</small></div>
    <div class="stat">🏅 <span id="sStick">0</span><small>stickers</small></div>
    <div class="stat">🔥 <span id="sBest">0</span><small>best streak</small></div>
  </div>
  <div class="menu">
    <button class="btn add" data-mode="add"><span class="e">➕</span>Adding<span class="lv" id="lvadd"></span></button>
    <button class="btn sub_" data-mode="sub"><span class="e">➖</span>Taking away<span class="lv" id="lvsub"></span></button>
    <button class="btn mul" data-mode="mul"><span class="e">✖️</span>Times<span class="lv" id="lvmul"></span></button>
    <button class="btn mix" data-mode="mix"><span class="e">🎲</span>Surprise mix<span class="lv">all quests</span></button>
  </div>
  <div class="row">
    <button class="btn small" id="toStickers">🏅 Stickers</button>
    <button class="btn small" id="toggleSound">🔊 Sound</button>
    <button class="btn small install" id="installBtn">📲 Install</button>
  </div>
</section>

<!-- GAME -->
<section class="screen" id="game">
  <div class="top">
    <button class="x" id="quit" aria-label="Quit">✕</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="pill">⭐ <span id="rStars">0</span></div>
  </div>
  <div class="card q">
    <div class="eq" id="eq"></div>
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="ans" id="ans"></div>
  <div class="streak" id="streak"></div>
</section>

<!-- RESULTS -->
<section class="screen" id="results">
  <div class="card res" style="margin-top:6vh">
    <div class="big" id="rBuddy">🎉</div>
    <h2 id="rTitle">Great job!</h2>
    <div class="stars" id="rStarRow"></div>
    <div id="rText"></div>
    <div class="new" id="rNew" style="display:none"></div>
    <div class="menu" style="margin-top:14px">
      <button class="btn add" id="again">Play again</button>
      <button class="btn mix" id="goHome">Home</button>
    </div>
  </div>
</section>

<!-- STICKERS -->
<section class="screen" id="stickers">
  <div class="top">
    <button class="x" id="stBack" aria-label="Back">←</button>
    <h1 style="font-size:30px;margin:0;flex:1;text-align:left">My Stickers</h1>
  </div>
  <p class="sub" id="stInfo"></p>
  <div class="grid" id="stGrid"></div>
</section>

</div>

<div class="modal" id="confirm">
  <div class="card">
    <h3>Stop this quest?</h3>
    <div>Your stars from this round are kept.</div>
    <button class="btn add" id="keepGoing">Keep playing</button>
    <button class="btn sub_" id="yesQuit">Stop</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var ROUND=10;
var STICKERS=["🦄","🐉","🚀","🦕","🐙","🦁","🐼","🐸","🦖","🐬","🦋","🐝","🤖","👾","🛸","🌈","🍕","🍦","⚽","🏆","🎸","🐧","🦈","🦉"];
var STARS_PER_STICKER=10;
var BUDDIES=["🦊","🐼","🦁","🐸"];
var MODE_NAME={add:"Adding",sub:"Taking away",mul:"Times"};

/* ---------- save ---------- */
var save={stars:0,best:0,stickers:0,sound:true,lv:{add:1,sub:1,mul:1}};
try{var s=JSON.parse(localStorage.getItem("mathquest")||"null");if(s){save=Object.assign(save,s);save.lv=Object.assign({add:1,sub:1,mul:1},s.lv||{})}}catch(e){}
function persist(){try{localStorage.setItem("mathquest",JSON.stringify(save))}catch(e){}}

/* ---------- sound ---------- */
var ac=null;
function tone(f,d,t,v){
  if(!save.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    var o=ac.createOscillator(),g=ac.createGain(),st=ac.currentTime+(t||0);
    o.type="sine";o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(v||.18,st+.02);
    g.gain.exponentialRampToValueAtTime(.0001,st+d);o.start(st);o.stop(st+d+.02);
  }catch(e){}
}
function sfxOk(){tone(660,.12,0);tone(880,.18,.1)}
function sfxNo(){tone(220,.22,0,.12)}
function sfxWin(){[523,659,784,1047].forEach(function(f,i){tone(f,.22,i*.12)})}

/* ---------- helpers ---------- */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rnd(0,a.length-1)]}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});$(id).classList.add("on")}

/* ---------- question generation ---------- */
function makeQ(mode,lv){
  var a,b,ans,sym;
  if(mode==="add"){
    sym="+";
    if(lv===1){a=rnd(1,9);b=rnd(1,10-a)}
    else if(lv===2){a=rnd(3,15);b=rnd(3,20-a>3?20-a:4);}
    else{a=rnd(11,69);b=rnd(3,30);if(a+b>99)b=99-a}
    ans=a+b;
  }else if(mode==="sub"){
    sym="−";
    if(lv===1){a=rnd(2,10);b=rnd(1,a-1)}
    else if(lv===2){a=rnd(8,20);b=rnd(2,a-1)}
    else{a=rnd(25,99);b=rnd(6,a-5)}
    ans=a-b;
  }else{
    sym="×";
    if(lv===1){a=pick([2,5,10]);b=rnd(1,10)}
    else if(lv===2){a=pick([2,3,4,5,10]);b=rnd(1,10)}
    else{a=rnd(2,10);b=rnd(2,10)}
    if(Math.random()<.5){var t=a;a=b;b=t}
    ans=a*b;
  }
  return {mode:mode,a:a,b:b,sym:sym,ans:ans,tries:0,missed:false};
}
function choices(q){
  var set={},out=[q.ans],c=[];
  if(q.mode==="mul"){c=[q.ans+q.a,q.ans-q.a,q.ans+q.b,q.ans-q.b,q.ans+1,q.ans-1,q.ans+10,q.ans-10]}
  else{c=[q.ans+1,q.ans-1,q.ans+2,q.ans-2,q.ans+10,q.ans-10,q.ans+3,q.ans-3]}
  shuffle(c);
  set[q.ans]=1;
  c.forEach(function(x){if(out.length<4&&x>=0&&!set[x]){set[x]=1;out.push(x)}});
  var guard=0;
  while(out.length<4&&guard++<50){var x=Math.max(0,q.ans+rnd(-6,6));if(!set[x]){set[x]=1;out.push(x)}}
  return shuffle(out);
}
function hintFor(q){
  if(q.mode==="add")return q.a+" and "+q.b+" more…";
  if(q.mode==="sub")return "Start at "+q.a+" and take away "+q.b;
  return q.a+" groups of "+q.b+" (count by "+q.b+"s!)";
}
function dotsFor(q){
  var small=Math.max(q.a,q.b)<=12;
  if(!small)return "";
  if(q.mode==="add")return "🔵".repeat(q.a)+" ➕ "+"🟢".repeat(q.b);
  if(q.mode==="sub")return "🔵".repeat(q.a-q.b)+"❌".repeat(q.b);
  return "";
}

/* ---------- game state ---------- */
var G=null;
function start(mode){
  G={mode:mode,queue:[],i:0,stars:0,firstTry:0,streak:0,bestStreak:0,done:0,total:ROUND,locked:false,
     stats:{add:[0,0],sub:[0,0],mul:[0,0]}};
  for(var n=0;n<ROUND;n++){
    var m=mode==="mix"?pick(["add","sub","mul"]):mode;
    G.queue.push(makeQ(m,save.lv[m]));
  }
  $("rStars").textContent=0;
  show("game");
  next();
}
function next(){
  if(G.i>=G.queue.length){return finish()}
  var q=G.queue[G.i];G.q=q;G.locked=false;
  $("eq").innerHTML=q.a+" "+q.sym+" "+q.b+" = <b>?</b>";
  $("hint").textContent="";$("dots").textContent="";
  $("streak").textContent=G.streak>=3?("🔥 "+G.streak+" in a row!"):"";
  $("prog").style.width=(G.done/G.total*100)+"%";
  var box=$("ans");box.innerHTML="";
  choices(q).forEach(function(v){
    var b=document.createElement("button");b.className="a";b.textContent=v;
    b.addEventListener("click",function(){answer(b,v)});
    box.appendChild(b);
  });
}
function answer(btn,v){
  if(G.locked)return;
  var q=G.q;
  if(v===q.ans){
    G.locked=true;btn.classList.add("ok");sfxOk();
    var st=G.stats[q.mode];
    if(q.tries===0){
      G.stars++;G.firstTry++;G.streak++;save.stars++;
      if(G.streak>G.bestStreak)G.bestStreak=G.streak;
      if(G.streak>save.best)save.best=G.streak;
      if(!q.retry){st[0]++;st[1]++}
      $("rStars").textContent=G.stars;
      if(G.streak>=3)$("streak").textContent="🔥 "+G.streak+" in a row!";
    }else{
      G.streak=0;
      if(!q.retry){st[1]++}
    }
    G.done++;
    $("prog").style.width=(G.done/G.total*100)+"%";
    persist();
    setTimeout(function(){G.i++;next()},q.tries===0?650:1000);
  }else{
    q.tries++;G.streak=0;sfxNo();
    btn.classList.add("no","off");
    $("streak").textContent="";
    if(q.tries===1){
      $("hint").textContent="Almost! "+hintFor(q);
      $("dots").textContent=dotsFor(q);
    }else{
      /* second miss: show the answer, and ask it again later for practice */
      G.locked=true;
      $("hint").textContent="The answer is "+q.ans+". We'll try this one again!";
      $("ans").querySelectorAll(".a").forEach(function(b){
        if(+b.textContent===q.ans)b.classList.add("ok");
      });
      if(!q.retry)G.stats[q.mode][1]++;
      var again=makeQ(q.mode,1);
      again.a=q.a;again.b=q.b;again.sym=q.sym;again.ans=q.ans;again.retry=true;
      G.queue.push(again);G.total++;
      G.done++;
      setTimeout(function(){G.i++;next()},2200);
    }
  }
}
function finish(){
  var pct=G.firstTry/ROUND;
  /* adapt difficulty per mode */
  var note="";
  ["add","sub","mul"].forEach(function(m){
    var s=G.stats[m];if(s[1]<4)return;
    var acc=s[0]/s[1];
    if(acc>=.9&&save.lv[m]<3){save.lv[m]++;note+="🚀 "+MODE_NAME[m]+" is now Level "+save.lv[m]+"!<br>"}
    else if(acc<.5&&save.lv[m]>1){save.lv[m]--;note+="🌱 Let's practise "+MODE_NAME[m]+" a bit more.<br>"}
  });
  var before=Math.floor((save.stars-G.stars)/STARS_PER_STICKER);
  var after=Math.floor(save.stars/STARS_PER_STICKER);
  var unlocked=[];
  for(var k=before;k<after&&k<STICKERS.length;k++)unlocked.push(STICKERS[k]);
  save.stickers=Math.min(after,STICKERS.length);
  persist();
  var title=pct>=.9?"AMAZING!":pct>=.7?"Great job!":pct>=.4?"Nice work!":"Good try!";
  $("rTitle").textContent=title;
  $("rBuddy").textContent=pct>=.7?"🎉":"💪";
  $("rStarRow").textContent="⭐".repeat(G.firstTry)||"—";
  $("rText").innerHTML="You got <b>"+G.firstTry+" of "+ROUND+"</b> on the first try!"+
    (G.bestStreak>=3?"<br>🔥 Best streak: "+G.bestStreak:"");
  var nb=$("rNew");
  var html=(unlocked.length?"New sticker: <span style='font-size:30px'>"+unlocked.join(" ")+"</span><br>":"")+note;
  nb.style.display=html?"block":"none";nb.innerHTML=html;
  show("results");
  if(pct>=.7||unlocked.length){sfxWin();confetti()}
}
function confetti(){
  var em=["🎉","⭐","✨","🎈","💜","🌟"];
  for(var i=0;i<28;i++){
    var d=document.createElement("div");d.className="confetti";d.textContent=pick(em);
    d.style.left=rnd(0,100)+"vw";d.style.animationDuration=(rnd(18,38)/10)+"s";
    d.style.animationDelay=(rnd(0,10)/10)+"s";
    document.body.appendChild(d);
    (function(x){setTimeout(function(){x.remove()},4500)})(d);
  }
}

/* ---------- home ---------- */
function refreshHome(){
  $("sStars").textContent=save.stars;
  $("sStick").textContent=Math.min(Math.floor(save.stars/STARS_PER_STICKER),STICKERS.length);
  $("sBest").textContent=save.best;
  ["add","sub","mul"].forEach(function(m){$("lv"+m).textContent="Level "+save.lv[m]});
  $("toggleSound").textContent=save.sound?"🔊 Sound":"🔇 Sound";
  var h=new Date().getHours();
  $("hello").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+"! Pick a quest!";
  $("buddy").textContent=BUDDIES[Math.floor(save.stars/25)%BUDDIES.length];
}
document.querySelectorAll("[data-mode]").forEach(function(b){
  b.addEventListener("click",function(){G=null;lastMode=b.dataset.mode;start(lastMode)});
});
var lastMode="add";
$("again").addEventListener("click",function(){start(lastMode)});
$("goHome").addEventListener("click",function(){refreshHome();show("home")});
$("quit").addEventListener("click",function(){$("confirm").classList.add("on")});
$("keepGoing").addEventListener("click",function(){$("confirm").classList.remove("on")});
$("yesQuit").addEventListener("click",function(){$("confirm").classList.remove("on");refreshHome();show("home")});
$("toggleSound").addEventListener("click",function(){save.sound=!save.sound;persist();refreshHome();if(save.sound)sfxOk()});

/* ---------- stickers ---------- */
$("toStickers").addEventListener("click",function(){
  var n=Math.min(Math.floor(save.stars/STARS_PER_STICKER),STICKERS.length);
  var g=$("stGrid");g.innerHTML="";
  STICKERS.forEach(function(s,i){
    var d=document.createElement("div");d.className="st"+(i<n?"":" lock");d.textContent=i<n?s:"🔒";g.appendChild(d);
  });
  var left=STARS_PER_STICKER-(save.stars%STARS_PER_STICKER);
  $("stInfo").textContent=n>=STICKERS.length?"You collected them all! 🏆":left+" more ⭐ for your next sticker!";
  show("stickers");
});
$("stBack").addEventListener("click",function(){show("home")});

/* ---------- PWA ---------- */
var deferred=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;$("installBtn").style.display="block"});
$("installBtn").addEventListener("click",function(){
  if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;$("installBtn").style.display="none"});
});
window.addEventListener("appinstalled",function(){$("installBtn").style.display="none"});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}});
}
document.addEventListener("gesturestart",function(e){e.preventDefault()});

refreshHome();
})();
</script>
</body>
</html>
